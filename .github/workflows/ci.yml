name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python folio selftest
      - run: python folio --help

  formula:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Audit the formula as committed
        run: |
          brew tap-new --no-git ci/local
          tap=$(brew --repository ci/local)
          cp Formula/folio.rb "$tap/Formula/folio.rb"
          brew audit --strict ci/local/folio

      - name: Install and test it from this checkout
        run: |
          # actions/checkout leaves a detached HEAD
          b=ci-${GITHUB_SHA::7}
          git checkout -q -B "$b"
          tap=$(brew --repository ci/local)
          from='head "https://github.com/jonaprieto/folio.git"'
          from+=', branch: "main"'
          to="head \"file://$PWD\", using: :git, branch: \"$b\""
          sed "s|$from|$to|" Formula/folio.rb > "$tap/Formula/folio.rb"
          # a sed that matched nothing would install from GitHub
          grep -q "file://$PWD" "$tap/Formula/folio.rb"
          brew install --HEAD ci/local/folio
          brew test ci/local/folio
